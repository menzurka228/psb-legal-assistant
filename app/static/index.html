<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Юридический ассистент</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#6b7280; --accent:#1f4fd1; --border:#e3e6eb; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .layout { display:grid; grid-template-columns: 1fr 420px; height:100vh; }
  .chat { display:flex; flex-direction:column; min-width:0; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); background:var(--panel); font-weight:600; }
  #log { flex:1; overflow:auto; padding:20px; }
  .msg { max-width:800px; margin:0 0 14px; padding:12px 14px; border-radius:10px; white-space:pre-wrap; }
  .user { background:#e8eefc; margin-left:auto; }
  .bot { background:var(--panel); border:1px solid var(--border); }
  .refused { border-color:#f0b429; }
  .src { color:var(--accent); cursor:pointer; text-decoration:underline; }
  form { display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--border); background:var(--panel); }
  textarea { flex:1; resize:none; height:54px; padding:10px; border:1px solid var(--border); border-radius:8px; font:inherit; }
  button { padding:0 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  aside { border-left:1px solid var(--border); background:var(--panel); overflow:auto; padding:16px; }
  aside h3 { margin:0 0 10px; font-size:14px; color:var(--muted); text-transform:uppercase; }
  .card { border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:10px; font-size:13px; }
  .card b { display:block; margin-bottom:4px; }
  .card pre { white-space:pre-wrap; margin:6px 0 0; font:inherit; }
  @media (max-width: 900px) { .layout { grid-template-columns:1fr; } aside { display:none; } }
</style>
</head>
<body>
<div class="layout">
  <section class="chat">
    <header>Юридический ассистент — ответы по базе нормативных документов</header>
    <div id="log"></div>
    <form id="f">
      <textarea id="q" placeholder="Задайте вопрос… (Enter — отправить)"></textarea>
      <button>Спросить</button>
    </form>
  </section>
  <aside>
    <h3>Подтверждающие фрагменты</h3>
    <div id="sources"><p style="color:var(--muted)">Здесь появятся положения, на которые опирается ответ.</p></div>
  </aside>
</div>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), srcBox = document.getElementById('sources');
const history = [];

function add(text, cls) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

function showSources(sources) {
  srcBox.innerHTML = sources.length ? '' : '<p style="color:var(--muted)">Источники не использованы.</p>';
  for (const s of sources) {
    const c = document.createElement('div'); c.className = 'card'; c.id = 'src-' + s.n;
    c.innerHTML = `<b>[${s.n}] ${s.doc}</b><span>${s.title}</span><pre></pre><span class="src">Открыть документ</span>`;
    c.querySelector('pre').textContent = s.text;
    c.querySelector('.src').onclick = () => openDoc(s.doc);
    srcBox.appendChild(c);
  }
}

async function openDoc(name) {
  const r = await fetch('/api/documents/' + encodeURIComponent(name)).then(r => r.json());
  srcBox.innerHTML = `<p><span class="src" id="back">← к фрагментам</span></p><div class="card"><b>${r.name}</b><pre></pre></div>`;
  srcBox.querySelector('pre').textContent = r.text;
  document.getElementById('back').onclick = () => showSources(lastSources);
}

let lastSources = [];
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const question = q.value.trim(); if (!question) return;
  q.value = ''; add(question, 'user');
  const wait = add('Ищу в базе знаний…', 'bot');
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question, history }) }).then(r => r.json());
    wait.textContent = r.answer; if (r.refused) wait.classList.add('refused');
    history.push({ role:'user', content:question }, { role:'assistant', content:r.answer });
    lastSources = r.sources || []; showSources(lastSources);
  } catch (err) { wait.textContent = 'Ошибка: ' + err; }
};
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });
</script>
</body>
</html>
